name: CI

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              out=miniray-$os-$arch
              test $os = windows && out=$out.exe
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags=-s -o tmp/$out .
            done
          done
          cd tmp && sha256sum * > SHA256SUMS
      - run: |
          tag=latest
          title=$(git log -1 --format=%cs)
          notes=$(git log -1 --format=%H)
          gh release delete $tag --yes || true
          gh release create $tag tmp/* --verify-tag --title "$title" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/qusic/miniray:latest
          platforms: linux/amd64,linux/arm64
